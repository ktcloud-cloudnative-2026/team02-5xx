spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:order_db}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none # 스키마 변경은 Flyway 마이그레이션으로만 한다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false # 재시도 정책은 RabbitConfig.listenerRetryCustomizer 참고

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

clients:
  menu:
    base-url: ${MENU_SERVICE_URL:http://localhost:8081}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  cooking:
    base-url: ${COOKING_SERVICE_URL:http://localhost:8084}

# RabbitMQ 이벤트 (이름·라우팅 키는 초안, Cooking 담당자와 합의 후 확정)
events:
  exchange: peakorder.events
  dead-letter-exchange: peakorder.dlx
  order-confirmed:
    routing-key: order.confirmed
  cooking-completed:
    queue: order.cooking-completed
    routing-key: cooking.completed
  outbox:
    poll-interval-ms: 1000
    batch-size: 50

# Cooking 장애 감지(US-13): GET /actuator/health 를 확인해 연속 실패 시 신규 주문·결제 차단
cooking-health:
  interval-ms: 5000
  failure-threshold: 3
