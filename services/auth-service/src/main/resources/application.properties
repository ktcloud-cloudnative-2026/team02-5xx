spring.application.name=auth-service
# New session APIs stay unavailable until explicit key/origin configuration is supplied.
auth.session.enabled=${AUTH_SESSION_ENABLED:false}
auth.session.issuer=${AUTH_JWT_ISSUER:}
auth.session.audience=${AUTH_JWT_AUDIENCE:}
auth.session.key-id=${AUTH_JWT_KEY_ID:}
auth.session.private-key-file=${AUTH_JWT_PRIVATE_KEY_FILE:}
auth.session.public-key-file=${AUTH_JWT_PUBLIC_KEY_FILE:}
auth.session.allowed-origins=${AUTH_ALLOWED_ORIGINS:}
auth.session.cookie-name=${AUTH_REFRESH_COOKIE_NAME:peakorderRefreshToken}
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${AUTH_DB_USERNAME:auth}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

auth.registration.password-min-length=${AUTH_PASSWORD_MIN_LENGTH:12}
auth.registration.password-max-length=${AUTH_PASSWORD_MAX_LENGTH:64}
auth.registration.terms-version=${AUTH_TERMS_VERSION:}
auth.registration.privacy-version=${AUTH_PRIVACY_VERSION:}
