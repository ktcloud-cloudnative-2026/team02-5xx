spring.application.name=auth-service
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${AUTH_DB_USERNAME:auth}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

auth.registration.password-min-length=${AUTH_PASSWORD_MIN_LENGTH:12}
auth.registration.password-max-length=${AUTH_PASSWORD_MAX_LENGTH:64}
auth.registration.terms-version=${AUTH_TERMS_VERSION:}
auth.registration.privacy-version=${AUTH_PRIVACY_VERSION:}
