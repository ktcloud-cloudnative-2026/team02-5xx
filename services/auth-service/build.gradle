plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.peakorder'
version = '0.0.1-SNAPSHOT'
description = 'Peak Order Auth Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // health probe·metrics (docs/observability.md 1-2)
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus' // /actuator/prometheus 지표 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    def databaseTestsEnabled = providers.environmentVariable('AUTH_DB_TEST_URL')
        .map { value -> !value.isBlank() }.getOrElse(false)
    inputs.property('authDatabaseTestsEnabled', databaseTestsEnabled)
    outputs.upToDateWhen { !databaseTestsEnabled }
    outputs.doNotCacheIf('Database tests require a live isolated database') { databaseTestsEnabled }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.28.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('wrapper') {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531'
}
