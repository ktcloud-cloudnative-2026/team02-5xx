plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.peakorder'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'      // REST API
	implementation 'org.springframework.boot:spring-boot-starter-validation'  // 요청 검증
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // DB 접근
	implementation 'org.springframework.boot:spring-boot-starter-flyway'      // 마이그레이션
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'        // RabbitMQ
	implementation 'org.springframework.boot:spring-boot-starter-actuator'    // health, metrics
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'  // Swagger UI
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'                // /actuator/prometheus

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// 실제 PostgreSQL 통합 테스트(#114). 버전은 Spring Boot BOM이 관리(Testcontainers 2.0.5)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'  // @ServiceConnection
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'      // @Testcontainers, @Container
	testImplementation 'org.testcontainers:testcontainers-postgresql'         // PostgreSQLContainer
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
	java {
		googleJavaFormat()      // 예시. 팀에서 정한 스타일로 바꾸세요
		removeUnusedImports()
	}
}

tasks.named('test') {
	useJUnitPlatform {
		// ./gradlew test -PunitOnly → DB(Docker)가 필요한 통합 테스트(@Tag("integration"))를 빼고 단위 테스트만
		if (project.hasProperty('unitOnly')) {
			excludeTags 'integration'
		}
	}
	// CI 로그에서 실제로 실행된 테스트 수를 확인할 수 있게 요약을 남긴다(#114)
	addTestListener(new TestListener() {
		void beforeSuite(TestDescriptor suite) {}
		void beforeTest(TestDescriptor test) {}
		void afterTest(TestDescriptor test, TestResult result) {}
		void afterSuite(TestDescriptor desc, TestResult result) {
			def counts = "전체 ${result.testCount}, 성공 ${result.successfulTestCount}, 실패 ${result.failedTestCount}, 건너뜀 ${result.skippedTestCount}"
			if (desc.parent == null) {
				println "테스트 결과: ${result.resultType} — ${counts}"
			} else if (desc.name == desc.className && desc.className?.endsWith('IntegrationTest')) {
				println "통합 테스트 ${desc.className.tokenize('.').last()}: ${counts}"
			}
		}
	})
}
