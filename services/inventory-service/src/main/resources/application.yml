spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:inventory_db}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none # 스키마 변경은 Flyway 마이그레이션으로만 한다
    open-in-view: false
  flyway:
    enabled: true

inventory:
  stock-hold-ttl: ${STOCK_HOLD_TTL:5m} # 재고 임시 확보 유효시간 (기본 5분, 테스트 10s)
  # 관리자 API(IN-03·04·05) 노출: 인증(STORE_ADMIN, #112) 연동 전까지 기본 꺼짐. 격리된 로컬에서만 INVENTORY_ADMIN_ENABLED=true (PR #143 리뷰)
  admin:
    enabled: ${INVENTORY_ADMIN_ENABLED:false}

clients:
  menu:
    base-url: ${MENU_SERVICE_URL:http://localhost:8081} # Menu 서비스 주소 (MI-02 호출)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html