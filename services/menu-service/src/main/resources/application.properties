spring.application.name=menu-service
# Deployment gate, not per-request Gateway authentication. Enable only behind the agreed boundary.
menu.admin.enabled=${MENU_ADMIN_ENABLED:false}
spring.datasource.url=${MENU_DB_URL}
spring.datasource.username=${MENU_DB_USERNAME}
spring.datasource.password=${MENU_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MI-01 identifiers and quantities must be JSON integers, not coerced strings/floats.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
