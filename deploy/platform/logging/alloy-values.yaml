# dev Alloy values (#323, #293 결정) — grafana/alloy 1.15.0 (deploy/argocd/dev/logging.yaml에서 버전 고정)
# 목표: 워커에만 DaemonSet, /var/log/pods 읽기 전용만 마운트, peakorder Pod 로그만, CRD 0개, 최소 RBAC
crds:
  create: false                  # PodLogs 등 CRD 설치 안 함(11/23 장애 교훈)

alloy:
  enableReporting: false         # Grafana Labs로 익명 사용 통계 전송 끔
  mounts:
    varlog: false                # /var/log 전체 대신
    extra:
      - name: varlogpods         # /var/log/pods만 읽기 전용(containerd가 Pod 로그를 실제 파일로 씀)
        mountPath: /var/log/pods
        readOnly: true
      - name: storage            # --storage.path(/tmp/alloy): 읽은 위치(positions) 등. readOnlyRootFilesystem이라 쓰기 볼륨 필요
        mountPath: /tmp/alloy
  # /var/log/pods는 root:root 750, 로그 파일은 root:root 640(dev cp 확인, 11/24) → root가 "소유자"로 읽음.
  # SELinux 없음 → privileged 불필요(정진혁 님 조건: privileged·hostNetwork 금지). 소유자 읽기라 capability도 불필요.
  # 차트 README는 파일 수집에 privileged: true를 권장하지만 SELinux 노드까지 고려한 것. 최종 확인은 설치 후 실제 수집 여부.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:                     # 값은 사용량을 보고 조정
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  configMap:
    create: true
    content: |
      // peakorder namespace에서 이 노드에 있는 Pod만 찾는다
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["peakorder"]
        }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // Loki 라벨은 namespace·app·pod·container만(docs/observability.md 1절). 파일 경로도 여기서 만든다
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.cri.receiver]
      }

      // containerd 로그 파일은 줄마다 "시각 stdout F " 접두어가 붙는다(CRI 형식) → 떼어 내야 원문(ECS JSON)이 남음.
      // JSON 파싱은 하지 않고 원문 그대로 저장(조회 때 | json) — JVM 비JSON 줄·텍스트 로그 서비스도 버리지 않음
      loki.process "cri" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset                # tolerations 없음 → control-plane taint가 있는 cp에는 뜨지 않음
  podLabels:
    app: alloy
    team: team02
  extraLabels:                   # DaemonSet 라벨(차트 지원)
    app: alloy
    team: team02
  volumes:
    extra:
      - name: varlogpods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: storage            # Pod 전용 임시 폴더(노드 hostPath 아님 — 쓰기 hostPath 금지 조건). Pod가 다시 만들어지면 비워짐
        emptyDir:
          sizeLimit: 100Mi

# 기본 RBAC(클러스터 전체 configmaps·secrets 읽기 등)을 최소로: Pod 찾기에 필요한 것만
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  clusterRules:                  # B안: 템플릿이 빈 목록을 처리하지 못해 무해한 namespaces 읽기를 둠
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch"]

# Alloy 자체 UI·지표(포트 12345)용 Service는 끈다. 로그는 Alloy가 Loki로 보내는 방식이라 필요 없고,
# Alloy 지표 수집은 합의된 범위가 아니다(#323). 필요해지면 켜고 라벨 예외 범위를 다시 정한다.
service:
  enabled: false

# ServiceAccount 라벨(차트 지원). ConfigMap·ClusterRole·ClusterRoleBinding은 차트에 추가 라벨 키가 없어 팀장님 예외 승인 대상(#323)
serviceAccount:
  additionalLabels:
    app: alloy
    team: team02
