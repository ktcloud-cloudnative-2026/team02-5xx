# 1) Service: 다른 서비스가 "rabbitmq"라는 이름으로 찾아오게 하는 문패
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: peakorder
  labels:
    app: rabbitmq
    team: team02
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp          # 서비스들이 메시지를 주고받는 문
      port: 5672
    - name: management    # 관리 화면 문
      port: 15672
---
# 2) StatefulSet: 이름(rabbitmq-0)과 저장 공간이 고정되는 Pod
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: peakorder
  labels:
    app: rabbitmq
    team: team02
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        team: team02
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management   # latest 금지 → 버전 고정
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:          # "요청 받을 준비 됐니?"
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:           # "살아 있니?" (아니면 재시작)
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq   # 메시지가 저장되는 곳
  volumeClaimTemplates:            # Pod마다 저장 공간(PVC) 자동 생성
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
