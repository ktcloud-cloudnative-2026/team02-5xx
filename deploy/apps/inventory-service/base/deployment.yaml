apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
    team: team02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        team: team02
    spec:
      # 같은 namespace의 Service 정보를 환경 변수로 자동 주입하지 않는다(Order·Payment와 같음, #160).
      enableServiceLinks: false
      containers:
        - name: inventory-service
          image: ghcr.io/ktcloud-cloudnative-2026/team02-5xx/inventory:sha-4c73a8d6c8049cfb76ada07eb9a889d7909b0120
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-service-db
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-service-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-service-db
                  key: DB_PASSWORD
            - name: MENU_SERVICE_URL
              value: http://menu-service:8080
            # 관리자 API(IN-02~06)는 STORE_ADMIN 인가(#112) 확정 전까지 켜지 않는다.
            - name: INVENTORY_ADMIN_ENABLED
              value: "false"
            # t2-db 한 대에 DB 12개(max_connections 100)라 서비스별 연결 풀을 줄인다(#186).
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            # 컨테이너 메모리 제한 안에서 힙이 차지할 비율(나머지는 메타스페이스·스레드용)
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60.0
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
