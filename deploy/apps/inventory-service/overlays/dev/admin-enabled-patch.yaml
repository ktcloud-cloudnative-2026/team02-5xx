# Issue #335: dev에서만 관리자 API(IN-02~06)를 켠다.
# Gateway JWT(admin-securitypolicy.yaml, #303 방식)와 서비스 STORE_ADMIN 권한 검사(#247)가 모두 있는 상태에서만 켠다.
# prod는 이 패치에 포함하지 않는다(base 값 "false" 유지).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  template:
    spec:
      containers:
        - name: inventory-service
          env:
            - name: INVENTORY_ADMIN_ENABLED
              value: "true"
