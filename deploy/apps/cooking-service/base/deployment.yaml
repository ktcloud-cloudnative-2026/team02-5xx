apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooking-service
  labels:
    app: cooking-service
    team: team02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cooking-service
  template:
    metadata:
      labels:
        app: cooking-service
        team: team02
    spec:
      # 같은 namespace의 Service 정보를 RABBITMQ_PORT=tcp://... 같은 환경 변수로
      # 자동 주입하지 않게 한다. 앱 설정 이름(RABBITMQ_PORT)과 겹쳐 시작이 실패한다(#161).
      enableServiceLinks: false
      containers:
        - name: cooking-service
          image: ghcr.io/ktcloud-cloudnative-2026/team02-5xx/cooking:sha-8bb8c680af1b8e11e6e6c2179704a812b2935c6e
          ports:
            - name: http
              containerPort: 8080
          env:
            # 로컬 기본 포트 8084(application.yml)를 클러스터에서는 8080으로 맞춘다.
            # Order는 http://cooking-service:8080으로 호출한다(#158).
            - name: SERVER_PORT
              value: "8080"
            # application.yml의 DB_HOST·DB_PORT·DB_NAME 조립식 대신 Secret의 JDBC URL을 쓴다.
            # 환경 변수가 application.yml보다 우선한다(로컬에서 DB_NAME 없이 기동 확인).
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: cooking-service-db
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cooking-service-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cooking-service-db
                  key: DB_PASSWORD
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            # CO-02가 Menu MI-01을 호출한다.
            - name: MENU_SERVICE_URL
              value: http://menu-service:8080
            # 관리자 API(CO-03·04)는 인증(STORE_ADMIN) 확정(#99·#112) 전까지 켜지 않는다.
            - name: COOKING_ADMIN_ENABLED
              value: "false"
            # 컨테이너 메모리 제한 안에서 힙이 차지할 비율(나머지는 메타스페이스·스레드용). Order와 같은 기준.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60.0
            # 로그를 한 줄 JSON(ECS)으로 출력한다. K8s에서만 켜고 로컬은 텍스트 로그 유지 (docs/observability.md 3-1)
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            # t2-db 한 대에 DB 12개(max_connections 100)라 서비스별 연결 풀을 줄인다(#186, #222).
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # DB·RabbitMQ 상태는 검사에 넣지 않는다(일시 단절로 재시작이 반복되지 않게).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
