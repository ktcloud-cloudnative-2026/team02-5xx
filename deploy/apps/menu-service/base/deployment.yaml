apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: peakorder
  labels:
    app: menu-service
    team: team02
spec:
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
        team: team02
    spec:
      # preStop 10초 + Spring Boot 정상 종료 단계 기본 30초 + 여유 10초 (#354).
      terminationGracePeriodSeconds: 50
      containers:
        - name: menu-service
          # Unpublished placeholder; replace before deployment. See ../README.md.
          image: ghcr.io/ktcloud-cloudnative-2026/team02-5xx/menu:sha-REPLACE_WITH_PUBLISHED_40_CHAR_COMMIT_SHA
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MENU_DB_URL
              valueFrom:
                secretKeyRef:
                  name: menu-service-db
                  key: MENU_DB_URL
                  optional: false
            - name: MENU_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: menu-service-db
                  key: MENU_DB_USERNAME
                  optional: false
            - name: MENU_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: menu-service-db
                  key: MENU_DB_PASSWORD
                  optional: false
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60.0
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
