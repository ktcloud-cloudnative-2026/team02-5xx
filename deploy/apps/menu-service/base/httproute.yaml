# ME-01/02 공개 조회만 전달한다. ID 형식 검증과 JSON 오류 응답은 Menu가 담당한다.
# RegularExpression 지원은 배포 대상 Envoy Gateway 버전에서 별도 확인한다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: menu-service
  namespace: peakorder
  labels:
    app: menu-service
    team: team02
spec:
  parentRefs:
    - name: peakorder-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/menus
          method: GET
        - path:
            type: RegularExpression
            value: ^/api/v1/menus/[^/]+$
          method: GET
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
              - X-User-Role
      backendRefs:
        - name: menu-service
          port: 8080
