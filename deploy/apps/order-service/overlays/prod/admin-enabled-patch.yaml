# Issue #435: prod에서 관리자 API(OR-06~09)를 켠다(11/26 팀 결정: Gateway JWT + 서비스 권한 검사를 전제로 prod에도 개방).
# Gateway JWT(admin-securitypolicy.yaml)와 서비스 STORE_ADMIN 권한 검사(#263)가 있는 상태에서만 켠다.
# 이 overlay의 SecurityPolicy(securitypolicy.yaml·admin-securitypolicy.yaml)가 Order와 같은 동기화에서 함께 올라가며, 동기화 뒤 정책 적용(kubectl get securitypolicy)을 확인하고 관리자 기능을 확인한다.
# 정책 없이 Order만 올리면 위조 헤더가 서비스까지 전달되므로 이 overlay를 한 번에 적용한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  template:
    spec:
      containers:
        - name: order-service
          env:
            - name: ORDER_ADMIN_ENABLED
              value: "true"
