apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    team: team02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        team: team02
    spec:
      # 같은 namespace의 Service 정보를 RABBITMQ_PORT=tcp://... 같은 환경 변수로
      # 자동 주입하지 않게 한다. 앱 설정 이름(RABBITMQ_PORT)과 겹쳐 시작이 실패한다(Payment #160).
      enableServiceLinks: false
      containers:
        - name: order-service
          image: ghcr.io/ktcloud-cloudnative-2026/team02-5xx/order:sha-eeee6a21cdfaeea17cc42aaf3b8829197639eae5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-db
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: order-service-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-db
                  key: DB_PASSWORD
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            - name: MENU_SERVICE_URL
              value: http://menu-service:8080
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8080
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8080
            - name: COOKING_SERVICE_URL
              value: http://cooking-service:8080
            # 관리자 API(OR-06·07)는 인증(STORE_ADMIN) 확정(#112) 전까지 켜지 않는다.
            - name: ORDER_ADMIN_ENABLED
              value: "false"
            # 컨테이너 메모리 제한 안에서 힙이 차지할 비율(나머지는 메타스페이스·스레드용)
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60.0
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
