apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    team: team02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        team: team02
    spec:
      # Issue #324: preStop 10초 + 앱 정상 종료 대기 30초(Spring Boot 4.1.2 server.shutdown 기본 GRACEFUL) + 여유 10초.
      terminationGracePeriodSeconds: 50
      containers:
        - name: auth-service
          image: ghcr.io/ktcloud-cloudnative-2026/team02-5xx/auth:sha-317b6ee68bf4cba0f356b5ebdd19abfc02c715d0
          ports:
            - name: http
              containerPort: 8080
          # Issue #321(#186 하위): 다른 Spring 서비스와 같은 시작값. limit 768Mi 안에서 heap 상한을 60%로 둔다.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60.0
            # docs/observability.md 3-1 (#324): Spring Boot 내장 ECS JSON 로그(라이브러리 추가 없음).
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
          lifecycle:
            preStop:
              # Service·Gateway가 엔드포인트에서 이 Pod를 뺄 때까지 SIGTERM을 늦춘다(Order #295와 같음).
              # 이미지 eclipse-temurin:21-jre-alpine의 sleep 사용.
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
