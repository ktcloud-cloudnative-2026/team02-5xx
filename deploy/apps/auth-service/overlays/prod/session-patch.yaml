# Auth prod 실행 설정 (초안). dev의 session-patch.yaml과 같은 구조로, 값은 모두 prod 클러스터의 Secret에서 읽는다.
# - Secret 이름·키는 dev와 같다(auth-service-db, auth-service-runtime, auth-service-jwt). 값은 prod 전용으로 따로 만든다.
#   dev의 서명 키·issuer를 prod에 복사하지 않는다. Secret 값은 Git에 넣지 않는다.
# - 약관 버전(AUTH_TERMS_VERSION·AUTH_PRIVACY_VERSION)은 넣지 않는다. 실제 약관이 정해질 때까지 prod 회원가입은
#   REGISTRATION_UNAVAILABLE로 막아 둔다(#268). 시연용 demo-v1을 prod에 넣지 않는다.
# - prod Secret 준비 전에는 Sync하지 않는다(필수 Secret이 없으면 Pod가 시작하지 못한다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: auth-service
          env:
            - name: AUTH_SESSION_ENABLED
              value: "true"
            - name: AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-db
                  key: DB_URL
            - name: AUTH_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-service-db
                  key: DB_USER
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-db
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: AUTH_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: auth-service-runtime
                  key: issuer
            - name: AUTH_JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: auth-service-runtime
                  key: audience
            - name: AUTH_JWT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: auth-service-runtime
                  key: key-id
            - name: AUTH_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: auth-service-runtime
                  key: allowed-origins
            - name: AUTH_JWT_PRIVATE_KEY_FILE
              value: /var/run/secrets/auth-jwt/private-key.pem
            - name: AUTH_JWT_PUBLIC_KEY_FILE
              value: /var/run/secrets/auth-jwt/public-key.pem
          volumeMounts:
            - name: auth-jwt
              mountPath: /var/run/secrets/auth-jwt
              readOnly: true
      volumes:
        - name: auth-jwt
          secret:
            secretName: auth-service-jwt
            optional: false
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
              - key: public-key.pem
                path: public-key.pem
