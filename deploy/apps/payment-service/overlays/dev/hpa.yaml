# Payment Service dev HPA (이슈 #362, #186 합의: min 1, max 3, CPU 70%).
# - CPU 목표는 requests(100m) 대비 사용률이다. 부하 측정 뒤 requests·목표값을 조정한다.
# - 축소는 쿠버네티스 기본값(안정화 5분)을 따른다. Pod가 내려갈 때는 preStop과 정상 종료가 요청을 보호한다(#363).
# - Pod 수는 HPA가 정한다. Application의 ignoreDifferences(/spec/replicas)가 Git의 replicas: 1로 되돌리지 않게 한다(#363).
# - 이 HPA는 DB max_connections 상향(남규리, #186)과 Hikari 4/1(#363) 적용 뒤에 병합한다.
# - dev 전용이다. prod 적용은 별도 이슈에서 DB 연결 예산과 함께 결정한다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: peakorder
  labels:
    app: payment-service
    team: team02
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
