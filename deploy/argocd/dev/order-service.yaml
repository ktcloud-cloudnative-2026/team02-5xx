apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service-dev
  namespace: argocd
  labels:
    app: order-service
    team: team02
spec:
  project: peakorder-dev
  source:
    repoURL: https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
    targetRevision: main
    path: deploy/apps/order-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: peakorder
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
      allowEmpty: false
