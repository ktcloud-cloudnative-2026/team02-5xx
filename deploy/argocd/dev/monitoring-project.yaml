apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring-dev
  namespace: argocd
  labels:
    app: monitoring
    team: team02
spec:
  description: Monitoring dev application deployments
  sourceRepos:
    - https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
    - https://prometheus-community.github.io/helm-charts
    # 로깅(logging-dev, #323): Loki OSS 차트(grafana-community), Alloy 차트(grafana)
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet
    # Loki(Monolithic)는 StatefulSet. PVC는 StatefulSet 컨트롤러가 만들어 따로 허용하지 않는다(#293 이태훈 님)
    - group: apps
      kind: StatefulSet
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
