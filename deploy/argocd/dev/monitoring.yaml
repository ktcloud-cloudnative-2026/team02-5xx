apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dev
  namespace: argocd
  labels:
    app: monitoring
    team: team02
spec:
  project: monitoring-dev
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.2
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/deploy/platform/monitoring/values.yaml
    - repoURL: https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
