# prod 공통 인프라 Application. 서비스 Application과 같이 자동 동기화를 두지 않는다(수동 Sync).
# - RabbitMQ는 Order·Payment·Cooking보다 먼저 동기화한다. rabbitmq-secret(username·password)이 먼저 있어야 첫 기동 때 계정이 만들어진다.
# - 매니페스트(deploy/platform/prod/rabbitmq)는 Gateway·플랫폼 담당이 관리한다. 경로가 생기기 전에는 비교 오류가 나지만 배포되는 것은 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-prod
  namespace: argocd
  labels:
    app: rabbitmq
    team: team02
spec:
  project: peakorder-prod
  source:
    repoURL: https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
    targetRevision: main
    path: deploy/platform/prod/rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: peakorder
