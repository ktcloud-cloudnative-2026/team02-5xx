# prod 공통 인프라 Application. 서비스 Application과 같이 자동 동기화를 두지 않는다(수동 Sync).
# - NetworkPolicy는 모든 서비스가 정상 동작하는 것을 확인한 뒤 마지막에 동기화한다(먼저 켜면 서비스 간 통신이 막혀 원인 구분이 어렵다).
# - 매니페스트(deploy/platform/prod/network-policies)는 Gateway·플랫폼 담당이 관리한다. 경로가 생기기 전에는 비교 오류가 나지만 배포되는 것은 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies-prod
  namespace: argocd
  labels:
    app: network-policies
    team: team02
spec:
  project: peakorder-prod
  source:
    repoURL: https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
    targetRevision: main
    path: deploy/platform/prod/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: peakorder
