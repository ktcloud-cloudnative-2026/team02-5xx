# prod AppProject (초안). dev/project.yaml과 같은 구조이며, 현재 prod overlay가 만드는 종류만 허용한다.
# - prod overlay 렌더링 결과: Deployment·Service·HTTPRoute (2026-11-25 kubectl kustomize 확인)
# - SecurityPolicy·HPA는 prod overlay에 아직 없어 허용하지 않는다. prod에 추가할 때 리뷰로 함께 넣는다.
# - prod 클러스터의 Argo CD 설치·접속(SSH 호스트 키 확인)이 끝나기 전에는 적용하지 않는다(README 참고).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: peakorder-prod
  namespace: argocd
  labels:
    app: peakorder
    team: team02
spec:
  description: Peak Order prod application deployments
  sourceRepos:
    - https://github.com/ktcloud-cloudnative-2026/team02-5xx.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: peakorder
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
