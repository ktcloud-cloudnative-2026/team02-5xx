name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  readiness:
    name: Service readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      registered_count: ${{ steps.services.outputs.registered_count }}
      ready_services: ${{ steps.services.outputs.ready_services }}
      java_count: ${{ steps.services.outputs.java_count }}
      node_count: ${{ steps.services.outputs.node_count }}
    steps:
      - name: Checkout PR
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test CI foundation
        run: node --test .github/ci/ci.test.mjs

      - name: Check service registration and required files
        id: services
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node .github/ci/check-services.mjs

  java_ci:
    name: Java service CI
    needs: [readiness]
    if: ${{ needs.readiness.result == 'success' && needs.readiness.outputs.java_count != '0' && needs.readiness.outputs.java_count != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      service_results: ${{ steps.checks.outputs.service_results }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select runner Java 21
        shell: bash
        run: |
          java_home="${JAVA_HOME_21_X64:?Runner Java 21 is required}"
          "$java_home/bin/java" -XshowSettings:properties -version 2>&1 | grep -E 'java.specification.version = 21$'
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - name: Check registered Java services
        id: checks
        run: node .github/ci/run-services.mjs java

      # Validation-only evidence for Issue #37.
      - name: Verify Menu test count
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("services/menu-service/build/test-results/test").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("Menu JUnit XML report is missing")
          totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          expected = {"tests": 3, "failures": 0, "errors": 0, "skipped": 0}
          if totals != expected:
              raise SystemExit(f"Unexpected Menu test results: {totals}")
          summary = "### Menu 테스트 실행 검증\n\n테스트 3개 실행 · 실패 0개 · 오류 0개 · 생략 0개\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY

  react_ci:
    name: React service CI
    needs: [readiness]
    if: ${{ needs.readiness.result == 'success' && needs.readiness.outputs.node_count != '0' && needs.readiness.outputs.node_count != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      service_results: ${{ steps.checks.outputs.service_results }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check registered React services
        id: checks
        run: node .github/ci/run-services.mjs node

  final:
    name: CI Final
    needs: [readiness, java_ci, react_ci]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Evaluate all required jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/final-check.mjs
