name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

  push:
    branches: [main]

permissions:
  contents: read

# Issue #307: 같은 PR에서 새 실행(push·본문 수정·Ready 전환)이 시작되면 이전 실행을 자동 취소한다.
# main push는 커밋마다 이미지를 게시해야 하므로 SHA별 그룹으로 두고 취소하지 않는다.
# 취소된 실행에서도 CI Final은 always()로 실패를 남기므로, 취소 실행이 통과로 오인되지 않는다.
concurrency:
  group: pr-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readiness:
    name: Service readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      registered_count: ${{ steps.services.outputs.registered_count }}
      ready_services: ${{ steps.services.outputs.ready_services }}
      java_count: ${{ steps.services.outputs.java_count }}
      node_count: ${{ steps.services.outputs.node_count }}
    steps:
      - name: Checkout PR
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test CI foundation
        run: node --test .github/ci/ci.test.mjs .github/ci/image-ci.test.mjs .github/ci/dev-image-tags.test.mjs .github/ci/image-scope.test.mjs

      - name: Check service registration and required files
        id: services
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node .github/ci/check-services.mjs

  java_ci:
    name: Java service CI
    needs: [readiness]
    if: ${{ needs.readiness.result == 'success' && needs.readiness.outputs.java_count != '0' && needs.readiness.outputs.java_count != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      service_results: ${{ steps.checks.outputs.service_results }}
    # Issue #333: Auth DB 통합 테스트를 러너 안의 일회용 PostgreSQL에서 실행한다.
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_DB: auth_registration_test
          POSTGRES_USER: auth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Select runner Java 21
        shell: bash
        run: |
          java_home="${JAVA_HOME_21_X64:?Runner Java 21 is required}"
          "$java_home/bin/java" -XshowSettings:properties -version 2>&1 | grep -E 'java.specification.version = 21$'
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      # Issue #328: 공유 IP 러너의 Maven Central 429를 줄이려고 Gradle 의존성과 Wrapper 배포판만 캐시한다.
      # main push 실행이 저장한 캐시를 PR 실행이 복원한다(PR 캐시는 그 PR 안에서만 보인다).
      # 잠금 파일·gc.properties는 Gradle 안내대로 캐시하지 않는다(이전 실행의 잠금이 복원되면 대기가 생길 수 있음, #329 리뷰).
      - name: Restore Gradle dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('services/*/build.gradle', 'services/*/build.gradle.kts', 'services/*/settings.gradle', 'services/*/settings.gradle.kts', 'services/*/gradle/libs.versions.toml', 'services/*/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Check registered Java services
        id: checks
        env:
          AUTH_DB_TEST_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/auth_registration_test
          AUTH_DB_TEST_USERNAME: auth_test
          AUTH_DB_TEST_PASSWORD: ""
        run: node .github/ci/run-services.mjs java

  react_ci:
    name: React service CI
    needs: [readiness]
    if: ${{ needs.readiness.result == 'success' && needs.readiness.outputs.node_count != '0' && needs.readiness.outputs.node_count != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      service_results: ${{ steps.checks.outputs.service_results }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check registered React services
        id: checks
        run: node .github/ci/run-services.mjs node

  image_ci:
    name: Image build
    needs: [readiness, java_ci, react_ci]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && needs.readiness.result == 'success' && needs.readiness.outputs.registered_count != '0' && needs.readiness.outputs.registered_count != '' && (needs.java_ci.result == 'success' || (needs.readiness.outputs.java_count == '0' && needs.java_ci.result == 'skipped')) && (needs.react_ci.result == 'success' || (needs.readiness.outputs.node_count == '0' && needs.react_ci.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Issue #307: PR에서는 병합 검증 커밋에서 바뀐 서비스만 이미지를 빌드한다(공통 파일 변경 시 전체).
    env:
      CI_IMAGE_SCOPE: changed
    outputs:
      image_results: ${{ steps.report.outputs.image_results }}
    steps:
      - name: Checkout PR
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js 24
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure temporary image workspace
        run: |
          echo "CI_IMAGE_REPORT=$RUNNER_TEMP/peakorder-image-results.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/peakorder-ghcr-auth" >> "$GITHUB_ENV"

      - name: Build registered service images
        run: node .github/ci/image-ci.mjs check

      - name: Report image results
        id: report
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node .github/ci/image-ci.mjs report

  image_publish:
    name: Image build and GHCR
    needs: [readiness, java_ci, react_ci]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.readiness.result == 'success' && needs.readiness.outputs.registered_count != '0' && needs.readiness.outputs.registered_count != '' && (needs.java_ci.result == 'success' || (needs.readiness.outputs.java_count == '0' && needs.java_ci.result == 'skipped')) && (needs.react_ci.result == 'success' || (needs.readiness.outputs.node_count == '0' && needs.react_ci.result == 'skipped')) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_results: ${{ steps.report.outputs.image_results }}
    steps:
      - name: Checkout merged commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify all code checks before image publication
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/final-check.mjs

      - name: Configure temporary image workspace
        run: |
          echo "CI_IMAGE_REPORT=$RUNNER_TEMP/peakorder-image-results.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/peakorder-ghcr-auth" >> "$GITHUB_ENV"

      - name: Build all registered service images
        run: node .github/ci/image-ci.mjs check

      - name: Publish the built images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/image-ci.mjs publish

      - name: Report image results
        id: report
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        run: node .github/ci/image-ci.mjs report

  final:
    name: CI Final
    needs: [readiness, java_ci, react_ci, image_ci, image_publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Evaluate all required jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMAGE_MODE: ${{ github.event_name == 'push' && 'main' || 'pr' }}
          CI_IMAGE_SCOPE: changed
        run: node .github/ci/final-check.mjs

  # Issue #281: main 게시 성공 후 소스가 바뀐 서비스만 dev 태그 갱신 PR을 만든다.
  # PR 생성·push는 PEAKORDER_DEV_TAG_TOKEN으로만 하며, 토큰이 없으면 계획만 Summary에 남긴다.
  dev_image_tags:
    name: Dev image tag PR
    needs: [image_publish]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image_publish.result == 'success' }}
    permissions:
      contents: read
    concurrency:
      group: dev-image-tags
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout merged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Plan dev image tag updates
        id: plan
        env:
          IMAGE_RESULTS_JSON: ${{ needs.image_publish.outputs.image_results }}
        run: node .github/ci/dev-image-tags.mjs plan

      - name: Open dev image tag PR
        if: ${{ steps.plan.outputs.changed == 'true' }}
        env:
          DEV_TAG_TOKEN: ${{ secrets.PEAKORDER_DEV_TAG_TOKEN }}
          DEV_TAG_FILES: ${{ steps.plan.outputs.files }}
        run: node .github/ci/dev-image-tags.mjs open
